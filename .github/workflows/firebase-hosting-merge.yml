# https://github.com/firebase/firebase-tools

name: Deploy to Firebase Hosting on merge
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'vite.config.ts'
      - 'scripts/**'
      - 'package.json'
      - 'CHANGELOG.md'
jobs:
  build_and_deploy:
    # Skip dependency-only commits (even if package.json changed)
    if: ${{ !startsWith(github.event.head_commit.message, 'deps:') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v3
        with:
          cache: true
          # Optional but recommended for CI:
          require-lockfile: true
      - run: pnpm run build
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_STUMPED_GAME }}
          channelId: live
          projectId: stumped-game
